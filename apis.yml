aid: fiton
name: FitOn
description: >-
  FitOn is a consumer digital fitness and wellness platform offering free,
  on-demand workout classes (cardio, strength, yoga, Pilates, HIIT), guided
  meditation, personalized meal plans and nutrition tracking, recipes, and
  social challenges. FitOn serves 15 million+ members with celebrity and
  world-class trainers across mobile, web, and connected-TV apps (Apple TV,
  Roku, Chromecast, Fire TV). Its FitOn Health arm delivers an enterprise
  wellness benefit to employers, health plans, and brokers. FitOn is backed by
  Accel. As of this enrichment pass FitOn publishes no public developer API,
  developer portal, SDKs, or OpenAPI; consumer and B2B integration is handled
  through partnership programs rather than a self-serve API.
